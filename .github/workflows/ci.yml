name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholders only. lib/env.ts validates these at import time, so
      # `next build` needs them to exist. No real secrets belong here.
      MUX_TOKEN_ID: ci-placeholder
      MUX_TOKEN_SECRET: ci-placeholder
      DEEPGRAM_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
